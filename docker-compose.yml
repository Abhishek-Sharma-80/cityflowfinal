version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: cityflow-postgres
    restart: always
    environment:
      POSTGRES_DB: cityflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityflow-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cityflow_db
      FASTAPI_PORT: 8001
      FASTAPI_HOST: 0.0.0.0
    ports:
      - "8001:8001"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cityflow-frontend
    restart: always
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
